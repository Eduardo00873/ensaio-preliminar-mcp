# Balanceador do ensaio: round-robin simples entre as duas réplicas MCP.

# Um só processo de trabalho: o estado do round-robin é por processo, e com um
# único processo os pedidos alternam estritamente entre server-a e server-b.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Regista, por pedido, a réplica que o atendeu ($upstream_addr) e o número da
    # ligação ($connection), para confirmar que cada pedido vem numa ligação nova.
    log_format ensaio '$remote_addr conn=$connection "$request" $status '
                      'upstream=$upstream_addr upstream_status=$upstream_status '
                      'request_time=$request_time';
    access_log /dev/stdout ensaio;
    error_log  /dev/stderr warn;

    upstream mcp_replicas {
        # Sem diretiva de balanceamento: round-robin com pesos iguais.
        server server-a:8000;
        server server-b:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mcp_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # As respostas do Streamable HTTP podem vir em SSE: não guardar em
            # buffer, passar ao cliente à medida que chegam.
            proxy_buffering off;

            # O nginx não repete pedidos noutra réplica. Por omissão já não repete
            # POST, mas fica explícito: todas as repetições do ensaio vêm do
            # cliente, nunca do balanceador.
            proxy_next_upstream off;
        }
    }
}
